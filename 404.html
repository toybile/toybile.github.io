<script>
(() => {
  const aliases = new Set(['/lp', '/Propositional-Logic-Editor']);
  const path = location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
  if (aliases.has(path)) {
    location.replace('https://toybile.github.io/Logic-Editor/' + location.search + location.hash);
  }
  const ids = {original:['light','dark'],indigo:['indigo-light','indigo-dark'],petroleum:['petroleum-light','petroleum'],graphite:['graphite-light','graphite'],sand:['sand','sand-dark'],sage:['sage','sage-dark'],rose:['rose-light','rose-dark'],plum:['plum-light','plum-dark']};
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('portfolio-appearance-v2') || '{}') || {}; } catch (_) {}
  const dark = saved.mode === 'dark' || (saved.mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  const root = document.documentElement;
  root.dataset.appearanceTheme = (ids[saved.family] || ids.original)[dark ? 1 : 0];
  root.style.colorScheme = dark ? 'dark' : 'light';
  let portuguese = false;
  try { portuguese = localStorage.getItem('portfolio-language-v1') === 'pt-BR'; } catch (_) {}
  if (!portuguese) {
    root.lang = 'en';
    document.title = 'Page not found · toybile';
    addEventListener('DOMContentLoaded', () => {
      document.querySelector('h1').textContent = 'Page not found';
      document.querySelector('.home').textContent = 'Back to home';
    });
  }
})();
</script>
